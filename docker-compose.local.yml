# Production-like stack on your own PC: ENV=production, Postgres, worker, Caddy HTTPS at https://localhost,
# plus Mailpit to catch sign-up / reset emails (inbox at http://localhost:8025).
#
#   docker compose -p eztrading-local --env-file .env.prodlocal -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# .env.prodlocal holds this stack's settings (DOMAIN=localhost, APP_ENV_FILE=.env.prodlocal, SMTP_HOST=mailpit, ...).
services:
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"  # web inbox, only reachable from this PC

  web:
    depends_on:
      mailpit:
        condition: service_started
