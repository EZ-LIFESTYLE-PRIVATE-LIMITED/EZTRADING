services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eztrading
      POSTGRES_USER: eztrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eztrading -d eztrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  # EZT_IMAGE / IMAGE_TAG are set by the GitHub Actions deploy (prebuilt image from GHCR).
  # Locally they're unset, so `docker compose up --build` builds eztrading:latest from source.
  web:
    build: .
    image: ${EZT_IMAGE:-eztrading}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["web"]
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://eztrading:${POSTGRES_PASSWORD}@db:5432/eztrading
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ${EZT_IMAGE:-eztrading}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://eztrading:${POSTGRES_PASSWORD}@db:5432/eztrading
    depends_on:
      web:
        condition: service_healthy  # web runs migrations first

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
