name: Android app

# Builds the Trusted Web Activity wrapper in android/.
# Repository variable TWA_HOST = the site's host (e.g. trade.example.com).
# Optional secrets for a signed release: ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the release APK/AAB are unsigned.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 1.0.1)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_B64 secret: building unsigned release artifacts"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TWA_HOST: ${{ vars.TWA_HOST }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          args="-PversionCode=${{ github.run_number }}"
          [ -n "$TWA_HOST" ] && args="$args -PtwaHost=$TWA_HOST"
          [ -n "$VERSION_NAME" ] && args="$args -PversionName=$VERSION_NAME"
          ./gradlew assembleDebug assembleRelease bundleRelease $args

      - uses: actions/upload-artifact@v4
        with:
          name: eztrading-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
