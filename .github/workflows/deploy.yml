name: Deploy

# Runs after CI passes on main: builds the image, pushes it to GHCR, and rolls it out on the VPS.
# Rollback: Actions -> Deploy -> Run workflow, with the commit SHA to redeploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (commit SHA) to redeploy. Leave empty to build and deploy the current main."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/eztrading' }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: Work out image and tag
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          tag="${{ inputs.tag }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-$sha}" >> "$GITHUB_OUTPUT"
          echo "build=$([ -z "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.build == 'true' && steps.meta.outputs.sha || inputs.tag }}

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.build == 'true'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip deploy when no server is configured
        if: env.VPS_HOST == ''
        run: echo "::notice::Image pushed. Set the VPS_HOST, VPS_USER and VPS_SSH_KEY secrets to deploy automatically."

      - name: Set up SSH
        if: env.VPS_HOST != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts; fi
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n' "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Copy compose files
        if: env.VPS_HOST != ''
        run: scp docker-compose.yml Caddyfile "vps:$DEPLOY_PATH/"

      - name: Roll out
        if: env.VPS_HOST != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The job token can pull this repo's private image; it's passed on stdin, never on a command line.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' IMAGE='$IMAGE' TAG='$TAG' sh -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          set_env() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
          set_env EZT_IMAGE "$IMAGE"   # managed by the deploy workflow
          set_env IMAGE_TAG "$TAG"
          docker compose pull web worker
          docker compose up -d --no-build --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          REMOTE

      - name: Health check
        if: env.VPS_HOST != '' && env.DOMAIN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/healthz"; then echo; echo "Healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::https://$DOMAIN/healthz did not become healthy"; exit 1
